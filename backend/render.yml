services:
  - type: web
    name: fastapi-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: ENV
        value: production
      # Add your secrets here if needed:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
